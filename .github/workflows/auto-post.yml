name: Auto Blog Poster

on:
  schedule:
    - cron: '0 22 * * *' # 매일 아침 7시(한국시간) 자동 실행
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install google-generativeai
      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 비밀 금고에서 키를 꺼내옴
        run: python auto.py
      - name: Commit and Push
        run: |
          git config --global user.name "Auto Profit Bot"
          git config --global user.email "bot@example.com"
          git add posts/
          git commit -m "Auto-published today's post" || echo "No changes to commit"
          git push